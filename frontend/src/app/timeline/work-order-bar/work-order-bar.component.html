<div
  class="bar"
  [class]="'bar--' + workOrder.data.status"
  [class.bar--xs]="barSize === 'xs'"
  [class.bar--sm]="barSize === 'sm'"
  [attr.title]="tooltipText"
  role="button"
  tabindex="0"
  [attr.aria-label]="
    workOrder.data.name + ', ' + statusLabel + ', ' + workOrder.data.startDate + ' to ' + workOrder.data.endDate
  "
  (keydown.enter)="(barSize === 'md' || barSize === 'sm') && toggleMenu($event)"
>
  @if (barSize !== 'xs') {
    <span class="bar__name">{{ workOrder.data.name }}</span>
  }
  @if (barSize === 'md') {
    <span class="bar__badge" [class]="'badge--' + workOrder.data.status">
      {{ statusLabel }}
    </span>
  }
  @if (barSize === 'md' || barSize === 'sm') {
    <button class="bar__menu-btn" (click)="toggleMenu($event)" title="Actions">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
        <circle cx="2" cy="7" r="1.4" />
        <circle cx="7" cy="7" r="1.4" />
        <circle cx="12" cy="7" r="1.4" />
      </svg>
    </button>
  }
</div>

@if ((barSize === 'md' || barSize === 'sm') && menuOpen()) {
  <div class="bar__dropdown" [style.top.px]="dropdownTop()" [style.right.px]="dropdownRight()">
    <button class="dropdown-item" (click)="onEdit($event)">Edit</button>
    <button class="dropdown-item dropdown-item--danger" (click)="onDelete($event)">Delete</button>
  </div>
}
